name: Refactor

# Rector and Pint gain rules between releases. Resolving them daily turns a new rule
# into a reviewable pull request instead of a red 3.x.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    name: Apply lint fixes
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3.x
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Record tool versions
        id: tools
        run: |
          {
            echo "rector=$(composer show rector/rector --format=json | jq -r '.versions[0]')"
            echo "pint=$(composer show laravel/pint --format=json | jq -r '.versions[0]')"
          } >> "$GITHUB_OUTPUT"

      - name: Apply Rector and Pint
        run: composer lint

      - name: Open a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: 3.x
          branch: chore/apply-lint
          delete-branch: true
          commit-message: "chore: apply Rector ${{ steps.tools.outputs.rector }} and Pint ${{ steps.tools.outputs.pint }}"
          title: "chore: apply Rector ${{ steps.tools.outputs.rector }} and Pint ${{ steps.tools.outputs.pint }}"
          body: |
            Rector ${{ steps.tools.outputs.rector }} and Pint ${{ steps.tools.outputs.pint }} have suggestions for the current `3.x`.

            Opened by the daily Refactor workflow so a new upstream rule arrives as a reviewable change rather than a failing build. Review the diff on its merits: a rule that makes the code worse belongs in the `withSkip()` list in `rector.php`, not merged.
